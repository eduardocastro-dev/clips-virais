services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: &env
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Execute start.ps1 ou sh start.sh para gerar a configuracao}
      STUDIO_DATA: /studio/data
      STUDIO_FILES: /studio
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-America/Sao_Paulo}
      PIPER_MODEL: ${PIPER_MODEL:-/models/pt_BR-faber-medium.onnx}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
    volumes: &volumes
      - studio:/studio
      - ./models:/models:ro
      - ./assets:/studio/assets
      - ./temp:/studio/temp
    ports:
      - 127.0.0.1:8000:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        INSTALL_WHISPERX: ${INSTALL_WHISPERX:-0}
    command: [python, -m, backend.worker]
    environment: *env
    volumes: *volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, backend.worker, --health]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      STUDIO_TIMEZONE: America/Sao_Paulo
  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: [python, -m, backend.bootstrap]
    environment:
      <<: *env
      OMNIROUTE_PASSWORD: ${OMNIROUTE_PASSWORD:?Execute start.ps1}
      OMNIROUTE_FREE_MODELS: ${OMNIROUTE_FREE_MODELS:-}
    volumes: *volumes
    depends_on:
      api:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    restart: on-failure:3
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68}
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: '20128'
      HOSTNAME: 0.0.0.0
      API_HOST: 0.0.0.0
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?Execute start.ps1}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?Execute start.ps1}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD:?Execute start.ps1}
      REQUIRE_API_KEY: 'true'
      AUTH_COOKIE_SECURE: 'false'
      REDIS_URL: redis://:${REDIS_PASSWORD:?Execute start.ps1}@redis:6379/1
      NODE_OPTIONS: --max-old-space-size=2048
    ports:
      - 127.0.0.1:20128:20128
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, healthcheck.mjs]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
  # Redis persistente para OmniRoute; dados de db 0 antigos preservados, mas não utilizados.
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute start.ps1}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - shared-redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  studio:
  omniroute-data:
  shared-redis:
