name: Validate GTA Studio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile all Python modules and tests
        run: python -m compileall -q backend tests
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Test multi-cut and API regressions
        run: python -m pytest -q tests/test_live_multi_output.py tests/test_live_quota_radar.py tests/test_live_window_sampling.py tests/test_editorial_analytics.py tests/test_studio.py tests/test_api_boot_smoke.py tests/test_scenarios_tv.py tests/test_operations_monitor.py tests/test_youtube_connections.py tests/test_template_package.py tests/test_video_deletion.py
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
